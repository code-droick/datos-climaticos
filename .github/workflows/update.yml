name: Actualizar Dashboard de Datos

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta diariamente a las 8:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

# Asignamos permisos explícitos de lectura y escritura para el flujo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas jinja2

      - name: Ejecutar script de análisis
        run: python main.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "bot: actualización automática de datos curiosos" || exit 0
          git push
